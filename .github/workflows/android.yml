name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Paketleri yükle
        run: npm install

      - name: Android projesini oluştur
        run: |
          npx cap add android
          npx cap sync android

      - name: İkon, açılış ekranı, tema ve sürüm
        run: |
          pip install --quiet pillow
          python3 scripts/android_patch.py ${{ github.run_number }}

      - name: Test APK'sı derle (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../cikti
          cp app/build/outputs/apk/debug/app-debug.apk ../cikti/NeonStudyo-test-1.0.${{ github.run_number }}.apk

      - name: İmzalı sürüm derle (Google Play için, keystore varsa)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          cp app/build/outputs/bundle/release/app-release.aab ../cikti/NeonStudyo-1.0.${{ github.run_number }}.aab
          cp app/build/outputs/apk/release/app-release.apk ../cikti/NeonStudyo-1.0.${{ github.run_number }}.apk
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Dosyaları yükle
        uses: actions/upload-artifact@v4
        with:
          name: NeonStudyo-1.0.${{ github.run_number }}
          path: cikti/
          retention-days: 30
