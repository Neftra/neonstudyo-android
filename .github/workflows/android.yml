name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Java 21 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK kontrol
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || echo "::error::Android SDK bulunamadi"

      - name: Paketleri yükle
        run: |
          set -o pipefail
          npm install 2>&1 | tee npm.log

      - name: Android projesini oluştur
        run: |
          set -o pipefail
          (npx cap add android && npx cap sync android) 2>&1 | tee cap.log

      - name: İkon, açılış ekranı, tema ve sürüm
        run: |
          pip install --quiet pillow
          set -o pipefail
          python3 scripts/android_patch.py ${{ github.run_number }} 2>&1 | tee patch.log

      - name: Test APK'sı derle (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../gradle-debug.log
          mkdir -p ../cikti
          cp app/build/outputs/apk/debug/app-debug.apk ../cikti/NeonStudyo-test-1.0.${{ github.run_number }}.apk

      - name: İmzalı sürüm derle (Google Play için, keystore varsa)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          set -o pipefail
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" 2>&1 | tee ../gradle-release.log
          cp app/build/outputs/bundle/release/app-release.aab ../cikti/NeonStudyo-1.0.${{ github.run_number }}.aab
          cp app/build/outputs/apk/release/app-release.apk ../cikti/NeonStudyo-1.0.${{ github.run_number }}.apk
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Hata özeti
        if: failure()
        run: |
          for f in npm.log cap.log patch.log gradle-debug.log gradle-release.log; do
            [ -f "$f" ] || continue
            grep -E "error:|ERROR|FAILURE|What went wrong|Could not|> " "$f" | head -8 | while IFS= read -r line; do echo "::error::$line"; done
            echo "::error::SON SATIRLAR: $(tail -c 900 "$f" | tr '\n' ' ')"
          done

      - name: Dosyaları yükle
        uses: actions/upload-artifact@v4
        with:
          name: NeonStudyo-1.0.${{ github.run_number }}
          path: cikti/
          retention-days: 30
