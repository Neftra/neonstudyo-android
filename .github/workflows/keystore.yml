name: Imza anahtari olustur (bir kez)

on:
  workflow_dispatch:
    inputs:
      sifre:
        description: "Anahtar sifresi (en az 8 karakter, bir yere not et!)"
        required: true
      ad:
        description: "Adin Soyadin (sertifikada yazar)"
        required: true
        default: "Tuna"

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Keystore uret
        env:
          PASS: ${{ github.event.inputs.sifre }}
          NAME: ${{ github.event.inputs.ad }}
        run: |
          echo "::add-mask::$PASS"
          keytool -genkeypair -v -keystore neonstudyo-release.keystore -alias neonstudyo \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=$NAME, OU=NeonStudyo, O=NeonStudyo, C=TR"
          base64 -w 0 neonstudyo-release.keystore > KEYSTORE_BASE64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: imza-anahtari-GIZLI
          path: |
            neonstudyo-release.keystore
            KEYSTORE_BASE64.txt
          retention-days: 1
